        body { 
        background-color: #101827;

    body {
        background-color: #101827;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 50px;
    }

    h1 {
        color: #38bdf8;
        font-size: 45px;
    }

    h2 {
        font-size: 28px;
    }

    p {
        color: #cbd5e1;
        font-size: 20px;
    }

    button {
        background-color: #38bdf8;
        color: #101827;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
    }

<body>

    <h1>UniMind AI</h1>
    <h2>ارفع محاضرتكوابدا  رحلة التعلم </h2>

    <h2>مذاكرتك الجامعية بقت أذكى!</h2>
<input type="file" accept=".pdf" id="lectureFile">

<button onclick="uploadLecture()">رفع المحاضرة</button>

<p id="result"></p>

    <p>
        مساعدك الذكي لفهم المحاضرات وتلخيصها
        والتدرب على الامتحانات.
    </p>

    <button>ابدأ رحلتك</button>
    <div class="cards"> 


    <div class="card">
        <h3>📚 تلخيص المحاضرات</h3>
        <p>ارفع محاضرتك واحصل على ملخص منظم وسهل.</p>
        <button>ابدأ التلخيص</button>
    </div>

    <div class="card">
        <h3>🧠 شرح المحاضرات</h3>
        <p>افهم أصعب الموضوعات بطريقة بسيطة.</p>
        <button>ابدأ الشرح</button>
    </div>

    <div class="card">
        <h3>📝 اختبر نفسك</h3>
        <p>تدرب على أسئلة واختبر مستوى فهمك.</p>
        <button>ابدأ الاختبار</button>
    </div>

</div>
<script>
    
    function uploadLecture() {
        alert("أهلاً بك في UniMind AI!");
    }
</script>
